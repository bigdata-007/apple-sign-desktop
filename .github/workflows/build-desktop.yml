name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (e.g. v1.0.0); omit to skip GitHub Release
        required: false
        default: ""
  push:
    tags:
      - "v*"
    paths:
      - "source.zip.gpg"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-26
            tauri_args: "--bundles app,dmg"
          - name: macos-x86_64
            os: macos-26-intel
            tauri_args: "--target x86_64-apple-darwin --bundles app,dmg"
          - name: linux-x86_64
            os: ubuntu-22.04
            tauri_args: "--bundles appimage,deb,rpm"
          - name: windows-x86_64
            os: windows-latest
            tauri_args: "--bundles nsis"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require decrypt secret
        shell: bash
        run: |
          if [ -z "${{ secrets.SOURCE_GPG_PASSPHRASE }}" ]; then
            echo "Missing secret SOURCE_GPG_PASSPHRASE" >&2
            exit 1
          fi

      - name: Install gpg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            choco install gnupg -y
            echo "C:/Program Files (x86)/GnuPG/bin" >> "$GITHUB_PATH"
            echo "C:/Program Files/GnuPG/bin" >> "$GITHUB_PATH"
          fi
          gpg --version | head -1

      - name: Decrypt and extract source
        uses: ./.github/actions/decrypt-source
        with:
          passphrase: ${{ secrets.SOURCE_GPG_PASSPHRASE }}

      - name: Install Linux WebKit / GTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # openssl-sys vendored 在 Windows 要用完整 Perl；Git Bash 的 MSYS perl 缺 Locale::Maketext::Simple。
      - name: Install Strawberry Perl (Windows OpenSSL)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install strawberryperl -y --no-progress
          echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"
          echo "C:/Strawberry/c/bin" >> "$GITHUB_PATH"
          export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
          perl -v | head -3
          perl -MLocale::Maketext::Simple -e "print qq(Locale::Maketext::Simple OK\n)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace
          shared-key: desktop-${{ matrix.name }}

      - name: npm ci
        working-directory: workspace/desktop
        run: npm ci

      - name: Sync app version from release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "no release tag — keep version in source (tauri.conf.json)"
            python3 -c "import json; print('tauri version:', json.load(open('workspace/desktop/src-tauri/tauri.conf.json', encoding='utf-8'))['version'])"
            exit 0
          fi
          VER="${TAG#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "ERROR: tag '$TAG' -> version '$VER' looks invalid" >&2
            exit 1
          fi
          export VER
          # Windows runner 默认控制台编码非 UTF-8，避免 print 含非 ASCII 导致 exit 1
          export PYTHONIOENCODING=utf-8
          python3 <<'PY'
          import json, os, pathlib, re, sys
          ver = os.environ["VER"]

          def read_text(p: pathlib.Path) -> str:
              raw = p.read_bytes()
              if raw.startswith(b"\xef\xbb\xbf"):
                  raw = raw[3:]
              return raw.decode("utf-8")

          def write_text(p: pathlib.Path, text: str) -> None:
              p.write_bytes(text.encode("utf-8"))

          conf = pathlib.Path("workspace/desktop/src-tauri/tauri.conf.json")
          data = json.loads(read_text(conf))
          old = data.get("version")
          data["version"] = ver
          write_text(conf, json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          print(f"tauri.conf.json version: {old} -> {ver}")

          pkg = pathlib.Path("workspace/desktop/package.json")
          if pkg.is_file():
              pdata = json.loads(read_text(pkg))
              pdata["version"] = ver
              write_text(pkg, json.dumps(pdata, ensure_ascii=False, indent=2) + "\n")
              print(f"package.json version -> {ver}")

          cargo = pathlib.Path("workspace/desktop/src-tauri/Cargo.toml")
          text = read_text(cargo)
          text2, n = re.subn(
              r'(?m)^version\s*=\s*"[^"]*"',
              f'version = "{ver}"',
              text,
              count=1,
          )
          if n != 1:
              # debug aid on Windows
              head = "\n".join(text.splitlines()[:12])
              print("Cargo.toml head:\n" + head, file=sys.stderr)
              raise SystemExit(f"failed to patch Cargo.toml version (n={n})")
          write_text(cargo, text2)
          print(f"Cargo.toml version -> {ver}")
          PY

      - name: Build (Tauri)
        working-directory: workspace/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 确保 OpenSSL 配置走 Strawberry Perl，而不是 Git Bash 的 /usr/bin/perl
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
            hash -r
            which perl
            perl -v | head -2
          fi
          EXTRA="${{ matrix.tauri_args }}"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "updater signing key present"
          else
            echo "WARN: TAURI_SIGNING_PRIVATE_KEY unset — build may still produce installers"
          fi
          npx tauri build $EXTRA

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/${{ matrix.name }}"
          mkdir -p "$OUT"
          PLATFORM="${{ matrix.name }}"
          case "$PLATFORM" in
            macos-aarch64) UPDATER_KEY="darwin-aarch64" ;;
            macos-x86_64)  UPDATER_KEY="darwin-x86_64" ;;
            linux-x86_64)  UPDATER_KEY="linux-x86_64" ;;
            windows-x86_64) UPDATER_KEY="windows-x86_64" ;;
            *) echo "unknown matrix $PLATFORM" >&2; exit 1 ;;
          esac

          CANDIDATES=(
            workspace/target
            workspace/desktop/src-tauri/target
          )

          # 安装包
          for ROOT in "${CANDIDATES[@]}"; do
            [ -d "$ROOT" ] || continue
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              dest="$OUT/$base"
              [ -e "$dest" ] && dest="$OUT/${PLATFORM}-$base"
              cp "$f" "$dest"
              echo "installer + $dest"
            done < <(find "$ROOT" -type f -path '*/release/bundle/*' \( \
              -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
              -o -name '*-setup.exe' \
            \) -print0 2>/dev/null || true)
          done

          # 更新包（Tauri createUpdaterArtifacts）+ 同名 .sig
          UPDATER=""
          for ROOT in "${CANDIDATES[@]}"; do
            [ -d "$ROOT" ] || continue
            case "$UPDATER_KEY" in
              darwin-*)
                UPDATER="$(find "$ROOT" -type f \( -path '*/bundle/macos/*' -o -path '*/release/bundle/*' \) -name '*.app.tar.gz' -print -quit || true)"
                ;;
              linux-*)
                UPDATER="$(find "$ROOT" -type f -path '*/release/bundle/*' -name '*.AppImage' -print -quit || true)"
                ;;
              windows-*)
                UPDATER="$(find "$ROOT" -type f -path '*/release/bundle/*' -name '*.nsis.zip' -print -quit || true)"
                if [ -z "$UPDATER" ]; then
                  UPDATER="$(find "$ROOT" -type f -path '*/release/bundle/*' -name '*-setup.exe' -print -quit || true)"
                fi
                ;;
            esac
            [ -n "$UPDATER" ] && break
          done

          if [ -z "$UPDATER" ] || [ ! -f "$UPDATER" ]; then
            echo "ERROR: updater package not found for $UPDATER_KEY" >&2
            echo "--- bundle files ---" >&2
            find workspace/target workspace/desktop/src-tauri/target -type f -path '*/bundle/*' 2>/dev/null | head -120 || true
            exit 1
          fi
          SIG="${UPDATER}.sig"
          if [ ! -f "$SIG" ]; then
            # 交叉编译时偶发：AppleSign-x86_64.app.tar.gz + AppleSign.app.tar.gz.sig
            base_no_arch="$(basename "$UPDATER" | sed -E 's/-x86_64|-aarch64|_x86_64|_aarch64//')"
            alt="$(dirname "$UPDATER")/${base_no_arch}.sig"
            if [ -f "$alt" ]; then
              SIG="$alt"
            else
              echo "ERROR: missing signature for $UPDATER (need TAURI_SIGNING_PRIVATE_KEY)" >&2
              ls -la "$(dirname "$UPDATER")" >&2 || true
              exit 1
            fi
          fi

          # 统一文件名，避免双 mac 架构都叫 AppleSign.app.tar.gz
          case "$UPDATER_KEY" in
            darwin-aarch64) UNAME="AppleSign_aarch64.app.tar.gz" ;;
            darwin-x86_64)  UNAME="AppleSign_x86_64.app.tar.gz" ;;
            linux-x86_64)   UNAME="$(basename "$UPDATER")" ;;
            windows-x86_64) UNAME="$(basename "$UPDATER")" ;;
          esac
          cp "$UPDATER" "$OUT/$UNAME"
          cp "$SIG" "$OUT/${UNAME}.sig"

          python3 -c "import json,pathlib; p=pathlib.Path(r'$OUT'); m={'platform':'$UPDATER_KEY','updater_file':'$UNAME','signature_file':'${UNAME}.sig'}; p.joinpath('updater-manifest.json').write_text(json.dumps(m,indent=2)+'\n'); print(m)"

          ls -la "$OUT"
          first="$(find "$OUT" -type f ! -name 'updater-manifest.json' -print -quit || true)"
          if [ -z "$first" ]; then
            echo "ERROR: empty artifacts" >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apple-sign-${{ matrix.name }}${{ inputs.release_tag != '' && format('-{0}', inputs.release_tag) || '' }}
          path: artifacts/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout (for git notes)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          VER="${TAG#v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apple-sign-*
          merge-multiple: false
          path: release-assets

      - name: Stage installers, updater packs, latest.json
        shell: bash
        env:
          # 默认同仓库 GitHub Release；可设 Variables.UPDATE_URL_PREFIX 覆盖（勿带末尾 /）
          # 例：https://github.com/bigdata-007/apple-sign-desktop/releases/download/v1.0.0
          UPDATE_URL_PREFIX: ${{ vars.UPDATE_URL_PREFIX }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VER="${{ steps.tag.outputs.version }}"
          DEFAULT_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PREFIX="${UPDATE_URL_PREFIX:-$DEFAULT_PREFIX}"
          PREFIX="${PREFIX%/}"
          mkdir -p upload/installers upload/updater

          while IFS= read -r -d '' mf; do
            python3 -c "
          import json, pathlib, shutil
          mf = pathlib.Path(r'''$mf''')
          data = json.loads(mf.read_text())
          out = pathlib.Path('upload/updater')
          src_u = mf.parent / data['updater_file']
          src_s = mf.parent / data['signature_file']
          if not src_u.is_file() or not src_s.is_file():
              raise SystemExit(f'missing updater/sig for {data}')
          shutil.copy2(src_u, out / data['updater_file'])
          shutil.copy2(src_s, out / data['signature_file'])
          print('updater', data['platform'], data['updater_file'])
          "
          done < <(find release-assets -type f -name 'updater-manifest.json' -print0)

          # 安装包；与 updater 同名（如 Linux .AppImage）则跳过，避免 Release 资源重名
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              updater-manifest.json) continue ;;
              *.sig|*.app.tar.gz|*.nsis.zip) continue ;;
              *.dmg|*.AppImage|*.deb|*.rpm|*-setup.exe)
                if [ -e "upload/updater/$base" ]; then
                  echo "skip installer (also updater) $base"
                  continue
                fi
                cp "$f" "upload/installers/$base"
                echo "installer $base"
                ;;
            esac
          done < <(find release-assets -type f -print0)

          NOTES_FILE="$(mktemp)"
          {
            echo "Apple Sign Desktop ${TAG}"
            echo
            echo "- 安装包与自动更新包见本 Release Assets"
            echo "- latest.json → platforms.url 指向本 tag 下载链接"
          } > "$NOTES_FILE"

          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          export VER PREFIX TAG PUB_DATE NOTES_FILE
          python3 <<'PY'
          import json, pathlib, os
          ver = os.environ["VER"]
          prefix = os.environ["PREFIX"]
          notes = pathlib.Path(os.environ["NOTES_FILE"]).read_text().strip()
          pub_date = os.environ["PUB_DATE"]
          upd = pathlib.Path("upload/updater")
          platforms = {}
          for mf in pathlib.Path("release-assets").rglob("updater-manifest.json"):
              data = json.loads(mf.read_text())
              key = data["platform"]
              fname = data["updater_file"]
              sig_path = upd / data["signature_file"]
              pkg = upd / fname
              if not pkg.is_file() or not sig_path.is_file():
                  raise SystemExit(f"updater missing files for {key}: {fname}")
              platforms[key] = {
                  "url": f"{prefix}/{fname}",
                  "signature": sig_path.read_text().strip(),
              }
          if not platforms:
              raise SystemExit("no platforms for latest.json")
          doc = {
              "version": ver,
              "notes": notes,
              "pub_date": pub_date,
              "platforms": dict(sorted(platforms.items())),
          }
          text = json.dumps(doc, ensure_ascii=False, indent=2) + "\n"
          pathlib.Path("upload/latest.json").write_text(text)
          print(text)
          PY

          echo "---- installers ----"
          ls -la upload/installers
          echo "---- updater ----"
          ls -la upload/updater

      - name: Upload release staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: apple-sign-release-v${{ steps.tag.outputs.version }}
          path: |
            upload/installers
            upload/updater
            upload/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            upload/installers/*
            upload/updater/*
            upload/latest.json
          fail_on_unmatched_files: true
          body: |
            Apple Sign Desktop ${{ steps.tag.outputs.name }}

            - `latest.json`：自动更新清单（`platforms.url` → 本 Release 资源）
            - 安装包：macOS `.dmg` / Linux `.AppImage` `.deb` `.rpm` / Windows `-setup.exe`
            - 更新包：macOS `.app.tar.gz`（+ `.sig`）/ Linux `.AppImage`（+ `.sig`）/ Windows `.nsis.zip`（+ `.sig`）

            客户端 updater endpoint：
            `https://github.com/${{ github.repository }}/releases/latest/download/latest.json`
