name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (e.g. v1.0.0); omit to skip GitHub Release
        required: false
        default: ""
  push:
    tags:
      - "v*"
    paths:
      - "source.zip.gpg"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-26
            tauri_args: ""
          - name: macos-x86_64
            os: macos-26-intel
            tauri_args: "--target x86_64-apple-darwin"
          - name: linux-x86_64
            os: ubuntu-22.04
            tauri_args: ""
          - name: windows-x86_64
            os: windows-latest
            tauri_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require decrypt secret
        shell: bash
        run: |
          if [ -z "${{ secrets.SOURCE_GPG_PASSPHRASE }}" ]; then
            echo "Missing secret SOURCE_GPG_PASSPHRASE" >&2
            exit 1
          fi

      - name: Install gpg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            choco install gnupg -y
            echo "C:/Program Files (x86)/GnuPG/bin" >> "$GITHUB_PATH"
            echo "C:/Program Files/GnuPG/bin" >> "$GITHUB_PATH"
          fi
          gpg --version | head -1

      - name: Decrypt and extract source
        uses: ./.github/actions/decrypt-source
        with:
          passphrase: ${{ secrets.SOURCE_GPG_PASSPHRASE }}

      - name: Install Linux WebKit / GTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # openssl-sys vendored 在 Windows 要用完整 Perl；Git Bash 的 MSYS perl 缺 Locale::Maketext::Simple。
      - name: Install Strawberry Perl (Windows OpenSSL)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install strawberryperl -y --no-progress
          echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"
          echo "C:/Strawberry/c/bin" >> "$GITHUB_PATH"
          export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
          perl -v | head -3
          perl -MLocale::Maketext::Simple -e "print qq(Locale::Maketext::Simple OK\n)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace
          shared-key: desktop-${{ matrix.name }}

      - name: npm ci
        working-directory: workspace/desktop
        run: npm ci

      - name: Build (Tauri)
        working-directory: workspace/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 确保 OpenSSL 配置走 Strawberry Perl，而不是 Git Bash 的 /usr/bin/perl
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
            hash -r
            which perl
            perl -v | head -2
          fi
          EXTRA="${{ matrix.tauri_args }}"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "updater signing key present"
          else
            echo "WARN: TAURI_SIGNING_PRIVATE_KEY unset — build may still produce installers"
          fi
          npx tauri build $EXTRA

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/${{ matrix.name }}"
          mkdir -p "$OUT"
          # 只收 Tauri bundle 安装包 / 更新包（不含 target/release 下的裸二进制）
          CANDIDATES=(
            workspace/target
            workspace/desktop/src-tauri/target
          )
          for ROOT in "${CANDIDATES[@]}"; do
            [ -d "$ROOT" ] || continue
            echo "scanning $ROOT/**/release/bundle"
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              dest="$OUT/$base"
              if [ -e "$dest" ]; then
                dest="$OUT/${{ matrix.name }}-$base"
              fi
              cp "$f" "$dest"
              echo "  + $dest"
            done < <(find "$ROOT" -type f -path '*/release/bundle/*' \( \
              -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
              -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.nsis.zip' \
              -o -name '*.app.tar.gz' -o -name '*.exe.tar.gz' \
              -o -name '*.sig' \
            \) -print0 2>/dev/null || true)
          done
          ls -la "$OUT" || true
          first="$(find "$OUT" -type f -print -quit 2>/dev/null || true)"
          if [ -z "$first" ]; then
            echo "ERROR: no installer artifacts under $OUT" >&2
            find workspace/target workspace/desktop/src-tauri/target -type d -path '*/release/bundle' 2>/dev/null \
              | while read -r d; do echo "== $d"; ls -laR "$d" || true; done | head -80 || true
            exit 1
          fi
          echo "collected example: $first"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apple-sign-${{ matrix.name }}${{ inputs.release_tag != '' && format('-{0}', inputs.release_tag) || '' }}
          path: artifacts/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apple-sign-*
          merge-multiple: true
          path: release-assets

      - name: Stage release installers only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            dest="upload/$base"
            if [ -e "$dest" ]; then
              # 极端重名：用相对路径打散
              rel="${f#release-assets/}"
              safe="$(echo "$rel" | tr '/' '-')"
              dest="upload/$safe"
            fi
            cp "$f" "$dest"
            echo "staged $dest"
          done < <(find release-assets -type f \( \
            -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.nsis.zip' \
            -o -name '*.app.tar.gz' -o -name '*.exe.tar.gz' \
            -o -name '*.sig' \
          \) -print0)
          echo "---- upload tree ----"
          ls -la upload
          if [ -z "$(find upload -type f -print -quit)" ]; then
            echo "ERROR: no installer files to publish" >&2
            find release-assets -type f | head -80 || true
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: upload/*
          fail_on_unmatched_files: true
          body: |
            Apple Sign Desktop ${{ steps.tag.outputs.name }}

            多平台安装包见下方 Assets。
